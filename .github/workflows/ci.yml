name: ResearchHub CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      ai-worker: ${{ steps.paths.outputs.ai-worker }}
      collaboration: ${{ steps.paths.outputs.collaboration }}
      sandbox: ${{ steps.paths.outputs.sandbox }}
      infra: ${{ steps.paths.outputs.infra }}
      performance: ${{ steps.paths.outputs.performance }}
      scripts: ${{ steps.paths.outputs.scripts }}
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        run: python3 scripts/ci/check.py changes
      - name: Verify path selection and validation policy
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the reviewed analysis boundary before computation E2E
        run: python3 scripts/security/check_analysis_boundary.py
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.20'
          python-version: '3.13.3'
      - name: Prepare the worker and collaboration service for integration tests
        run: |
          uv sync --project ai-worker --frozen
          npm ci --prefix collaboration
          npm run build --prefix collaboration
      - name: Prepare Docker for Testcontainers and sandbox E2E
        run: |
          docker info
          docker build -t researchhub-sandbox:1.1.1 sandbox
      - name: Verify the backend and its existing coverage gates
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test:coverage -- --runInBand
          RESEARCHHUB_DEPLOYMENT_ENV=cloud npm run build

  ai-worker:
    needs: changes
    if: needs.changes.outputs.ai-worker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.20'
          python-version: '3.13.3'
      - working-directory: ai-worker
        run: |
          uv sync --frozen
          ./scripts/check.sh
          uv build --wheel --out-dir dist

  collaboration:
    needs: changes
    if: needs.changes.outputs.collaboration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: collaboration/package-lock.json
      - working-directory: collaboration
        run: |
          npm ci
          npm run build
          npm test

  sandbox:
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the reviewed analysis boundary before execution tests
        run: python3 scripts/security/check_analysis_boundary.py
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.20'
          python-version: '3.13.3'
      - run: uv sync --project ai-worker --frozen
      - run: docker build -t researchhub-sandbox:1.1.1 sandbox
      - name: Runtime tests with minimum 80% coverage
        working-directory: sandbox
        run: ../ai-worker/.venv/bin/python -m pytest
      - name: Constrained container acceptance tests
        run: ai-worker/.venv/bin/python sandbox/scripts/acceptance.py

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Bicep without Azure credentials
        run: |
          az config set bicep.use_binary_from_path=false bicep.check_version=false
          az bicep install --version v0.48.1
      - name: Build and lint existing Azure infrastructure
        run: python3 scripts/ci/check.py infra

  containers:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.performance == 'true' || needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.20'
          python-version: '3.13.3'
      - name: Build all production runtime images
        run: |
          docker build -t researchhub-backend:demo backend
          docker build -f frontend/Dockerfile -t researchhub-frontend:demo .
          docker build -t researchhub-ai-worker:demo ai-worker
          docker build -t researchhub-sandbox:1.1.1 sandbox
          python3 scripts/demo/verify-images.py
      - name: Real sandbox seed and idempotence through public REST
        run: |
          uv sync --project ai-worker --frozen
          scripts/demo/scale-up.sh --dependencies-only
          mkdir -p backend/target
          container_id=$(docker create researchhub-backend:demo)
          docker cp "$container_id:/app/backend.jar" backend/target/backend-0.0.1-SNAPSHOT.jar
          docker rm "$container_id"
          python3 scripts/demo/seed-server.py > .demo/seed-server.log 2>&1 &
          seed_pid=$!
          trap 'kill "$seed_pid" 2>/dev/null || true' EXIT
          python3 scripts/demo/wait-health.py http://127.0.0.1:18083/actuator/health/readiness
          ai-worker/.venv/bin/python -m coverage run --branch --source=scripts/demo --data-file=.demo/coverage scripts/demo/seed.py --load-users 5
          ai-worker/.venv/bin/python -m coverage run --append --branch --source=scripts/demo --data-file=.demo/coverage scripts/demo/seed.py --load-users 5
          kill "$seed_pid"
          wait "$seed_pid" || true
          trap - EXIT
      - name: Shared state, replica failure and two-minute smoke
        run: |
          scripts/demo/scale-up.sh
          ai-worker/.venv/bin/python -m coverage run --append --branch --source=scripts/demo --data-file=.demo/coverage scripts/demo/consistency.py
          ai-worker/.venv/bin/python -m coverage run --append --branch --source=scripts/demo --data-file=.demo/coverage scripts/demo/run-load.py --runs 1 --scenarios smoke --output .demo/ci-results
          ai-worker/.venv/bin/python -m coverage run --append --branch --source=scripts/demo --data-file=.demo/coverage -m unittest discover -s scripts/demo -p 'test_*.py'
          ai-worker/.venv/bin/python -m coverage report --data-file=.demo/coverage --include='scripts/demo/api.py,scripts/demo/seed.py,scripts/demo/generate_fixtures.py,scripts/demo/consistency.py,scripts/demo/run-load.py' --fail-under=80
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: local-two-instance-evidence
          include-hidden-files: true
          path: |
            .demo/ci-results/
            .demo/consistency.json
          retention-days: 14
      - name: Release demo containers
        if: always()
        run: docker compose --env-file .demo/scale.env -f infra/demo/compose.scale.yaml down -v

  performance:
    needs: changes
    if: needs.changes.outputs.performance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: '2.3.0'
      - name: Inspect load-test scripts without running load
        run: python3 scripts/ci/check.py performance
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Validate synthetic load configuration (80% coverage gate)
        run: node --test --experimental-test-coverage --test-coverage-lines=80 --test-coverage-branches=80 performance/test/*.test.js

  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Lint tracked shell scripts, including extensionless scripts
        run: python3 scripts/ci/check.py scripts
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.20'
          python-version: '3.13.3'
      - name: Verify CI helper coverage (minimum 80%)
        run: |
          uv sync --project ai-worker --frozen
          uv run --project ai-worker --frozen python -m coverage run --branch --source=scripts/ci --omit='*/test_*' --data-file="$RUNNER_TEMP/ci.coverage" -m unittest discover -s scripts/ci -p 'test_*.py'
          uv run --project ai-worker --frozen python -m coverage report --data-file="$RUNNER_TEMP/ci.coverage" --fail-under=80

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check Markdown links within the repository
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress './**/*.md'
          lycheeVersion: v0.24.2
          fail: true

  ci:
    name: CI required
    needs: [changes, backend, frontend, ai-worker, collaboration, sandbox, infra, containers, performance, scripts, docs]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/check.py gate
