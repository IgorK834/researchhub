name: Azure staging TTL check

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-staging-${{ vars.AZ_RESOURCE_GROUP }}
  cancel-in-progress: false

env:
  ENVIRONMENT: staging
  AZ_SUBSCRIPTION_ID: ${{ vars.AZ_SUBSCRIPTION_ID }}
  AZ_RESOURCE_GROUP: ${{ vars.AZ_RESOURCE_GROUP }}
  STAGING_OWNER: ${{ vars.STAGING_OWNER }}
  STAGING_RESULTS_DIR: ${{ github.workspace }}/.demo/azure/staging/results

jobs:
  ttl:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: azure-staging-ttl
    env:
      AUTO_DESTROY: ${{ vars.AUTO_DESTROY }}
    steps:
      - name: Set private runtime directory
        run: echo "STAGING_PRIVATE_DIR=$RUNNER_TEMP/researchhub-staging-private" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0, OIDC only
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZ_SUBSCRIPTION_ID }}
      - name: Detect expired staging; guarded deletion only when AUTO_DESTROY=true
        run: scripts/azure/ttl-check.sh
      - name: Surface expiry failure for GitHub workflow notifications
        if: failure()
        run: |
          echo '::error::Expired or invalid staging resources need attention. Review TTL evidence and billing.'
          echo 'Expired staging detected. Review evidence; deletion requires AUTO_DESTROY=true.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload redacted evidence before any later teardown
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: azure-staging-${{ github.sha }}-${{ github.run_id }}
          path: .demo/azure/staging/results/
          retention-days: 14
          if-no-files-found: warn
      - name: Remove private runtime credentials
        if: always()
        run: rm -rf -- "$STAGING_PRIVATE_DIR"
