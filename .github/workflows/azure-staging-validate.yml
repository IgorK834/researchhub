name: Azure staging contracts
on:
  pull_request:
    paths: ['infra/azure/**', 'scripts/azure/**', 'infrastructure/modules/foundation.bicep', 'backend/observability/**', 'backend/Dockerfile', '.github/workflows/azure-*.yml']
  push:
    branches: [main, master]
    paths: ['infra/azure/**', 'scripts/azure/**', 'infrastructure/modules/foundation.bicep', 'backend/observability/**', 'backend/Dockerfile', '.github/workflows/azure-*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Install local validators without cloud login
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          az config set bicep.use_binary_from_path=false bicep.check_version=false
          az bicep install --version v0.48.1
      - name: Bicep build/lint and ShellCheck for every staging script
        run: node scripts/azure/check.mjs
      - name: Guard, lifecycle, telemetry and compiled contracts (80% coverage)
        run: node --test --experimental-test-coverage --test-coverage-include='scripts/azure/control.mjs' --test-coverage-include='scripts/azure/services.mjs' --test-coverage-lines=80 --test-coverage-branches=80 --test-coverage-functions=80 scripts/azure/test/*.test.mjs
