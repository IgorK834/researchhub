# Local PostgreSQL, Azure Blob emulator, and Python processing worker for development. None consumes cloud
# resources: the cloud profile's DB_URL and BLOB_ENDPOINT are unrelated and do not come from here.
#
# Start:   docker compose up -d postgres azurite ai-worker
# Stop:    docker compose stop postgres azurite ai-worker
# Reset:   docker compose down -v   (removes both named volumes; deletes local data and blobs)
#
# DB_HOST, DB_PORT, DB_NAME, DB_USER, and DB_PASSWORD override the defaults below and are
# read the same way by the backend's local profile. See .env.example and
# docs/development/configuration.md.
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    container_name: researchhub-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-researchhub}
      POSTGRES_USER: ${DB_USER:-researchhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-researchhub}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-researchhub} -d ${DB_NAME:-researchhub}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    container_name: researchhub-azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:10000/devstoreaccount1?comp=list',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  ai-worker:
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    image: researchhub-ai-worker:local
    container_name: researchhub-ai-worker
    mem_limit: 1g
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=134217728,noexec,nosuid
    environment:
      AI_WORKER_HOST: 0.0.0.0
      AI_WORKER_PORT: 8090
      # Only translates this exact host origin; cloud URLs and SAS path/query are unchanged.
      AI_WORKER_BLOB_URL_ORIGIN: ${AI_WORKER_BLOB_URL_ORIGIN:-http://127.0.0.1:${AZURITE_BLOB_PORT:-10000}}
      AI_WORKER_BLOB_URL_TARGET_ORIGIN: ${AI_WORKER_BLOB_URL_TARGET_ORIGIN:-http://azurite:10000}
      AI_WORKER_PARSE_TIMEOUT_SECONDS: ${AI_WORKER_PARSE_TIMEOUT_SECONDS:-20}
      AI_WORKER_PARSE_CPU_SECONDS: ${AI_WORKER_PARSE_CPU_SECONDS:-15}
      AI_WORKER_PARSE_MEMORY_MIB: ${AI_WORKER_PARSE_MEMORY_MIB:-512}
      AI_WORKER_MAX_FILE_BYTES: ${AI_WORKER_MAX_FILE_BYTES:-52428800}
      AI_WORKER_MAX_CHARACTERS: ${AI_WORKER_MAX_CHARACTERS:-500000}
      AI_WORKER_MAX_UNITS: ${AI_WORKER_MAX_UNITS:-10000}
      AI_WORKER_MAX_PAGES: ${AI_WORKER_MAX_PAGES:-2000}
      AI_WORKER_MAX_ZIP_BYTES: ${AI_WORKER_MAX_ZIP_BYTES:-104857600}
      AI_WORKER_MAX_SHEETS: ${AI_WORKER_MAX_SHEETS:-100}
      AI_WORKER_XLSX_ROWS: ${AI_WORKER_XLSX_ROWS:-1000}
      AI_WORKER_XLSX_COLUMNS: ${AI_WORKER_XLSX_COLUMNS:-64}
      AI_WORKER_CHUNK_MAX_CHARACTERS: ${AI_WORKER_CHUNK_MAX_CHARACTERS:-1600}
      AI_WORKER_CHUNK_OVERLAP_CHARACTERS: ${AI_WORKER_CHUNK_OVERLAP_CHARACTERS:-150}
      AI_WORKER_CHUNK_MIN_CHARACTERS: ${AI_WORKER_CHUNK_MIN_CHARACTERS:-200}
      AI_WORKER_PREVIEW_ROWS: ${AI_WORKER_PREVIEW_ROWS:-50}
      AI_WORKER_XLSX_SAMPLES: ${AI_WORKER_XLSX_SAMPLES:-10}
      AI_WORKER_EMBEDDING_PROVIDER: ${AI_WORKER_EMBEDDING_PROVIDER:-}
      AI_WORKER_MODEL_PROVIDER: ${AI_WORKER_MODEL_PROVIDER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_MODEL_VERSION: ${GEMINI_MODEL_VERSION:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-}
      GEMINI_EMBEDDING_VERSION: ${GEMINI_EMBEDDING_VERSION:-}
      GEMINI_EMBEDDING_DIMENSION: ${GEMINI_EMBEDDING_DIMENSION:-}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-}
      GEMINI_PLANNING_THINKING_LEVEL: ${GEMINI_PLANNING_THINKING_LEVEL:-}
      GEMINI_REQUEST_TIMEOUT_SECONDS: ${GEMINI_REQUEST_TIMEOUT_SECONDS:-}
      GEMINI_OPERATION_TIMEOUT_SECONDS: ${GEMINI_OPERATION_TIMEOUT_SECONDS:-}
      FOUNDRY_ENDPOINT: ${FOUNDRY_ENDPOINT:-}
      FOUNDRY_API_KEY: ${FOUNDRY_API_KEY:-}
      FOUNDRY_DEPLOYMENT: ${FOUNDRY_DEPLOYMENT:-}
      FOUNDRY_MODEL: ${FOUNDRY_MODEL:-}
      FOUNDRY_MODEL_VERSION: ${FOUNDRY_MODEL_VERSION:-}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-}
      OPENAI_COMPAT_MODEL_VERSION: ${OPENAI_COMPAT_MODEL_VERSION:-}
      OPENAI_COMPAT_EMBEDDING_MODEL: ${OPENAI_COMPAT_EMBEDDING_MODEL:-}
      OPENAI_COMPAT_EMBEDDING_VERSION: ${OPENAI_COMPAT_EMBEDDING_VERSION:-}
      OPENAI_COMPAT_EMBEDDING_DIMENSION: ${OPENAI_COMPAT_EMBEDDING_DIMENSION:-}
      AZURE_EMBEDDING_ENDPOINT: ${AZURE_EMBEDDING_ENDPOINT:-}
      AZURE_EMBEDDING_API_KEY: ${AZURE_EMBEDDING_API_KEY:-}
      AZURE_EMBEDDING_DEPLOYMENT: ${AZURE_EMBEDDING_DEPLOYMENT:-}
      AZURE_EMBEDDING_MODEL: ${AZURE_EMBEDDING_MODEL:-}
      AZURE_EMBEDDING_VERSION: ${AZURE_EMBEDDING_VERSION:-}
      AZURE_EMBEDDING_DIMENSION: ${AZURE_EMBEDDING_DIMENSION:-}
      AI_WORKER_SERVICE_TOKEN: ${AI_WORKER_SERVICE_TOKEN:-local-development-worker-token-change-before-deployment}
    ports:
      - "127.0.0.1:${AI_WORKER_PORT:-8090}:8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

volumes:
  postgres-data:
  azurite-data:
