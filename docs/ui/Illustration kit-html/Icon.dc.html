<div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="10">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px 10px; background: #FFFFFF; border: 1px solid #ECE8E0; border-radius: 12px">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#1B1A17" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.d}}"></path></svg>
<div style="font-size: 11px; font-weight: 600; color: #5E5A52">{{t.n}}</div>
</div>
</sc-for>
</div>
</div>
</sc-if>
</div>
