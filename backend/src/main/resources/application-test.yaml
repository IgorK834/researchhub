# Test profile: explicit HTTP/infrastructure slices. No external services or developer secrets.
# Do not component-scan the full product graph here: use local/azure plus Testcontainers for that.
# JDBC, Flyway, and JPA auto-configuration are excluded so tests on this profile never open
# a database. Persistence tests that need PostgreSQL use Testcontainers and the local
# profile instead. See docs/development/persistence.md.
researchhub:
  environment: test

server:
  servlet:
    session:
      cookie:
        secure: false

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
