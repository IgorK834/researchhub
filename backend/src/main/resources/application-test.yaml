# Test profile: automated tests. No external services and no developer secrets.
# JDBC, Flyway, and JPA auto-configuration are excluded so tests on this profile never open
# a database. Persistence tests that need PostgreSQL use Testcontainers and the local
# profile instead. See docs/development/persistence.md.
researchhub:
  environment: test

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
