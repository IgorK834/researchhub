# Local adapter defaults are public development values, never deployment credentials.
researchhub:
  observability:
    scrape-token: ${METRICS_SCRAPE_TOKEN:local-development-metrics-token-change-before-deployment}
  debug:
    sql: false
  sources:
    storage:
      adapter: azure-blob
      azure-blob:
        endpoint: ${AZURITE_BLOB_ENDPOINT:http://127.0.0.1:10000/devstoreaccount1}
        account-name: ${AZURITE_ACCOUNT_NAME:devstoreaccount1}
        account-key: ${AZURITE_ACCOUNT_KEY:Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==}
        container-name: ${AZURITE_CONTAINER_NAME:researchhub-sources}
        create-container: true
        create-container-on-startup: ${BLOB_CREATE_CONTAINER_ON_STARTUP:false}
  processing:
    worker:
      base-url: ${AI_WORKER_BASE_URL:http://127.0.0.1:8090}
      service-token: ${AI_WORKER_SERVICE_TOKEN:local-development-worker-token-change-before-deployment}
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:researchhub}
    username: ${DB_USER:researchhub}
    password: ${DB_PASSWORD:researchhub}
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
---
# The demo profile group inherits infrastructure, never these local browser policies.
spring:
  config:
    activate:
      on-profile: "local & !demo"
researchhub:
  environment: local
  auth:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
server:
  servlet:
    session:
      cookie:
        secure: false
