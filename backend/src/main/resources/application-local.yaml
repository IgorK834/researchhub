# Local profile: non-secret defaults for a developer machine.
# Do not put a real password or connection string in this file. The datasource values
# below are throwaway defaults matching the root compose.yaml Postgres container, not
# secrets; override any of them with the matching DB_* environment variable. See
# docs/development/configuration.md.
researchhub:
  environment: local
  debug:
    sql: false

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:researchhub}
    username: ${DB_USER:researchhub}
    password: ${DB_PASSWORD:researchhub}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
