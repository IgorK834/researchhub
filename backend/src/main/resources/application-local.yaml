# Local profile: non-secret defaults for a developer machine.
# Do not put a real password or connection string in this file. The datasource values
# below are throwaway defaults matching the root compose.yaml Postgres container, not
# secrets; override any of them with the matching DB_* environment variable. See
# docs/development/configuration.md.
researchhub:
  environment: local
  debug:
    sql: false

server:
  servlet:
    session:
      cookie:
        # Local development is served over plain http://localhost, so a Secure cookie would never be
        # sent and login would appear to succeed while no session ever arrived. ADR-001 allows this
        # exception for localhost only; a deployed environment must set this to true.
        secure: false

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:researchhub}
    username: ${DB_USER:researchhub}
    password: ${DB_PASSWORD:researchhub}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      # validate, not none: Flyway still owns the schema, and Hibernate only checks that the
      # entities match the tables the migrations produced. Startup fails on a mismatch instead of
      # failing later on a query. Never create, create-drop, or update.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
