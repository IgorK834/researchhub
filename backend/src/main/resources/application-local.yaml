# Local profile: non-secret defaults for a developer machine.
# Do not put a real password or connection string in this file. The datasource values
# below are throwaway defaults matching the root compose.yaml Postgres container, not
# secrets; override any of them with the matching DB_* environment variable. See
# docs/development/configuration.md.
researchhub:
  environment: local
  debug:
    sql: false
  sources:
    storage:
      adapter: azure-blob
      azure-blob:
        # Azurite's documented development account. These public emulator credentials are not a
        # cloud secret. Override the endpoint when AZURITE_BLOB_PORT is changed in Compose.
        endpoint: ${AZURITE_BLOB_ENDPOINT:http://127.0.0.1:10000/devstoreaccount1}
        account-name: ${AZURITE_ACCOUNT_NAME:devstoreaccount1}
        account-key: ${AZURITE_ACCOUNT_KEY:Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==}
        container-name: ${AZURITE_CONTAINER_NAME:researchhub-sources}
  processing:
    dispatcher:
      enabled: ${PROCESSING_DISPATCHER_ENABLED:true}
      fixed-delay: ${PROCESSING_FIXED_DELAY:PT1S}
      batch-size: ${PROCESSING_BATCH_SIZE:4}
      max-attempts: ${PROCESSING_MAX_ATTEMPTS:5}
      initial-backoff: ${PROCESSING_INITIAL_BACKOFF:PT2S}
      max-backoff: ${PROCESSING_MAX_BACKOFF:PT1M}
      stale-timeout: ${PROCESSING_STALE_TIMEOUT:PT5M}
    worker:
      base-url: ${AI_WORKER_BASE_URL:http://127.0.0.1:8090}
      request-timeout: ${AI_WORKER_REQUEST_TIMEOUT:PT30S}

server:
  servlet:
    session:
      cookie:
        # Local development is served over plain http://localhost, so a Secure cookie would never be
        # sent and login would appear to succeed while no session ever arrived. ADR-001 allows this
        # exception for localhost only; a deployed environment must set this to true.
        secure: false

spring:
  servlet:
    multipart:
      # The application stream meter is still authoritative. These servlet bounds reject a large
      # multipart part before it can be materialised by the web stack.
      max-file-size: 52428800B
      max-request-size: 53477376B
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:researchhub}
    username: ${DB_USER:researchhub}
    password: ${DB_PASSWORD:researchhub}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      # validate, not none: Flyway still owns the schema, and Hibernate only checks that the
      # entities match the tables the migrations produced. Startup fails on a mismatch instead of
      # failing later on a query. Never create, create-drop, or update.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
