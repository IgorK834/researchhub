# Cloud profile. These values have no default.
# Startup fails when DB_URL or BLOB_ENDPOINT is missing or blank.
#
# DB_URL is not wired to spring.datasource yet: connecting to a managed cloud PostgreSQL
# is later, out-of-scope work. For now this profile only proves DB_URL and BLOB_ENDPOINT
# are present. JDBC, Flyway, and JPA auto-configuration are excluded here for the same
# reason they are excluded for the test profile, so this profile never attempts a real
# JDBC connection.
#
# When a later task wires the cloud datasource, set spring.datasource.url from DB_URL and
# spring.jpa.hibernate.ddl-auto to none or validate. Do not use create or update. Flyway
# remains the only schema writer.
researchhub:
  environment: cloud
  auth:
    cors:
      # Empty means same-origin only. Supply exact HTTPS origins for an explicit allowlist.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  cloud:
    db-url: ${DB_URL:}
    blob-endpoint: ${BLOB_ENDPOINT:}

server:
  # Default does not trust client-supplied Forwarded/X-Forwarded-* headers.
  # TLS termination must be configured at the trusted edge before enabling native handling.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      cookie:
        secure: true
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
