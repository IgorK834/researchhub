researchhub:
  # INSTANCE_ID / researchhub.instance-id overrides the hostname resolved before logging starts.
  observability:
    scrape-token: ${METRICS_SCRAPE_TOKEN:}
  collaboration:
    internal-url: ${COLLABORATION_INTERNAL_URL:http://127.0.0.1:8091}
    enabled: ${COLLABORATION_ENABLED:false}
    service-token: ${COLLABORATION_SERVICE_TOKEN:}
    websocket-url: ${COLLABORATION_WEBSOCKET_URL:ws://localhost:8091}
    token-ttl: ${COLLABORATION_TOKEN_TTL:PT120S}
  analysis:
    execution:
      dispatcher:
        enabled: ${ANALYSIS_EXECUTION_DISPATCHER_ENABLED:true}
        fixed-delay: ${ANALYSIS_EXECUTION_FIXED_DELAY:PT1S}
    sandbox:
      # Local Docker is an explicit trusted dependency; image/tag and security flags are fixed in the adapter.
      enabled: ${ANALYSIS_SANDBOX_ENABLED:false}
      socket-path: ${ANALYSIS_SANDBOX_SOCKET_PATH:/var/run/docker.sock}
      timeout: ${ANALYSIS_SANDBOX_TIMEOUT:PT45S}
      memory-mi-b: ${ANALYSIS_SANDBOX_MEMORY_MIB:256}
      cpus: ${ANALYSIS_SANDBOX_CPUS:1}
      pids: ${ANALYSIS_SANDBOX_PIDS:64}
  auth:
    registration:
      mode: ${REGISTRATION_MODE:open}
    session-store: ${AUTH_SESSION_STORE:servlet}
    password:
      # Minimum password length, enforced in one place: dev.researchhub.user.application.PasswordPolicy,
      # which both the registration service and the register DTO validator use.
      #
      # There is also a fixed maximum of 72 *bytes*, which is not configurable because it belongs to
      # BCrypt rather than to us: BCrypt hashes only the first 72 bytes of its input and ignores the
      # rest, so two passwords sharing that prefix would verify against the same hash. Longer input is
      # rejected instead of silently truncated. Note bytes, not characters — non-ASCII costs more than
      # one byte each in UTF-8.
      min-length: 12
  security:
    quotas:
      # Memory is for a single instance; demo/azure select the shared PostgreSQL adapter.
      store: ${COST_QUOTA_STORE:memory}
      retention: ${COST_QUOTA_RETENTION:P7D}
      max-attempts: ${COST_QUOTA_MAX_ATTEMPTS:3}
      cleanup-cron: ${COST_QUOTA_CLEANUP_CRON:0 0 * * * *}
      window: PT1M
      max-buckets: 100000
      llm: {user: 20, workspace: 60}
      analysis: {user: 10, workspace: 30}
      retrieval: {user: 60, workspace: 180}
  sources:
    # The largest file accepted as one source, in bytes. 50 MiB. Cannot exceed this hard ceiling; a larger value fails startup. See docs/development/sources.md.
    max-size-bytes: 52428800
    storage:
      # Which SourceStorage adapter holds the bytes. The local profile selects azure-blob and supplies its
      # Azurite settings. Blob container names and credentials belong to the adapter's own settings, never here.
      # Every runtime profile must supply an adapter; missing dependencies fail startup.
  documents:
    history:
      # How old the newest restore point must be before an autosave takes another one. A manual save is always
      # a restore point; an autosave is one only when this much time has passed since the last. ISO-8601
      # duration. See dev.researchhub.document.application.CheckpointPolicy and V7__create_document_versions.sql.
      autosave-checkpoint-interval: PT10M
      scheduler:
        enabled: ${DOCUMENT_SNAPSHOT_SCHEDULER_ENABLED:true}
        fixed-delay: ${DOCUMENT_SNAPSHOT_FIXED_DELAY:PT1M}

spring:
  application:
    name: backend
  profiles:
    # Product beans are unconditional; only infrastructure defaults are inherited.
    group:
      demo: [local]
      cloud: [azure]
  session:
    jdbc:
      # V36 is the only schema writer, including PostgreSQL deployments.
      initialize-schema: never
      cleanup-cron: ${SESSION_CLEANUP_CRON:0 * * * * *}
      flush-mode: on-save
      save-mode: on-set-attribute
  servlet:
    multipart:
      max-file-size: 52428800B
      max-request-size: 53477376B
      file-size-threshold: 0B

server:
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        name: JSESSIONID
        # The session id is the credential. JavaScript must never be able to read it: see
        # docs/adr/ADR-001-authentication.md.
        http-only: true
        # Limits cross-site submission of the cookie. Defence in depth behind CSRF tokens, not a
        # replacement for them.
        same-site: lax
        secure: true
        # `secure` is set per profile: false locally so http://localhost works, true wherever the app is
        # served over HTTPS.

logging:
  structured:
    json:
      add:
        replicaId: ${researchhub.instance-id}
    format:
      console: logstash

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
---
spring:
  config:
    activate:
      on-profile: demo
researchhub:
  auth:
    session-store: ${AUTH_SESSION_STORE:jdbc}

---
spring:
  config:
    activate:
      on-profile: demo
researchhub:
  security:
    quotas:
      store: ${COST_QUOTA_STORE:postgres}

---
# Product policies apply to every runtime profile.
researchhub:
  export:
    retention: ${EXPORT_RETENTION:PT168H}
    dispatcher:
      enabled: ${EXPORT_DISPATCHER_ENABLED:true}
      fixed-delay: ${EXPORT_FIXED_DELAY:PT1S}
  ai:
    conversations:
      stream:
        max-concurrent: ${AI_CONVERSATION_STREAM_MAX_CONCURRENT:8}
        timeout: ${AI_CONVERSATION_STREAM_TIMEOUT:PT180S}
        heartbeat: ${AI_CONVERSATION_STREAM_HEARTBEAT:PT10S}
    diagnostics:
      enabled: ${AI_DIAGNOSTICS_ENABLED:false}
      capture-content: ${AI_DIAGNOSTICS_CAPTURE_CONTENT:false}
      staff-ids: ${AI_DIAGNOSTICS_STAFF_IDS:}
      # Exact provider/model/version match; no speculative pricing defaults.
      rates: []
    features:
      source-analysis:
        max-output-tokens: ${AI_SOURCE_ANALYSIS_MAX_OUTPUT_TOKENS:6144}
        temperature: ${AI_SOURCE_ANALYSIS_TEMPERATURE:0}
        context:
          max-tokens: ${AI_SOURCE_ANALYSIS_CONTEXT_MAX_TOKENS:98304}
          max-bytes: ${AI_SOURCE_ANALYSIS_CONTEXT_MAX_BYTES:65536}
      authoring:
        max-output-tokens: ${AI_AUTHORING_MAX_OUTPUT_TOKENS:4096}
        temperature: ${AI_AUTHORING_TEMPERATURE:0}
      workspace-question:
        top-k: ${AI_WORKSPACE_QUESTION_TOP_K:6}
        temperature: ${AI_WORKSPACE_QUESTION_TEMPERATURE:0}
        max-output-tokens: ${AI_WORKSPACE_QUESTION_MAX_OUTPUT_TOKENS:4096}
      grounded-response:
        template-id: grounded-response:2
        # Use "none" for deployments that do not support temperature.
        temperature: ${AI_GROUNDED_RESPONSE_TEMPERATURE:0}
        max-output-tokens: ${AI_GROUNDED_RESPONSE_MAX_OUTPUT_TOKENS:4096}
        context:
          max-tokens: ${AI_GROUNDED_RESPONSE_CONTEXT_MAX_TOKENS:32768}
          max-bytes: ${AI_GROUNDED_RESPONSE_CONTEXT_MAX_BYTES:24576}
          collapse-exact-duplicates: ${AI_GROUNDED_RESPONSE_CONTEXT_COLLAPSE_EXACT_DUPLICATES:true}
  sources:
    external-search:
      enabled: ${EXTERNAL_SEARCH_ENABLED:false}
      api-key: ${BRAVE_SEARCH_API_KEY:}
      timeout: ${EXTERNAL_SEARCH_TIMEOUT:PT8S}
  processing:
    dispatcher:
      enabled: ${PROCESSING_DISPATCHER_ENABLED:true}
      fixed-delay: ${PROCESSING_FIXED_DELAY:PT1S}
      batch-size: ${PROCESSING_BATCH_SIZE:4}
      max-attempts: ${PROCESSING_MAX_ATTEMPTS:5}
      initial-backoff: ${PROCESSING_INITIAL_BACKOFF:PT2S}
      max-backoff: ${PROCESSING_MAX_BACKOFF:PT1M}
      stale-timeout: ${PROCESSING_STALE_TIMEOUT:PT5M}
    worker:
      request-timeout: ${AI_WORKER_REQUEST_TIMEOUT:PT120S}
      source-access-ttl: ${AI_WORKER_SOURCE_ACCESS_TTL:PT5M}

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
