researchhub:
  auth:
    password:
      # Minimum password length, enforced in one place: dev.researchhub.user.application.PasswordPolicy,
      # which both the registration service and the register DTO validator use.
      #
      # There is also a fixed maximum of 72 *bytes*, which is not configurable because it belongs to
      # BCrypt rather than to us: BCrypt hashes only the first 72 bytes of its input and ignores the
      # rest, so two passwords sharing that prefix would verify against the same hash. Longer input is
      # rejected instead of silently truncated. Note bytes, not characters — non-ASCII costs more than
      # one byte each in UTF-8.
      min-length: 12
  sources:
    # The largest file accepted as one source, in bytes. 50 MiB. Must be at most 1 GiB, the ceiling
    # ck_sources_size_bytes enforces; a larger value fails startup. See docs/development/sources.md.
    max-size-bytes: 52428800
    storage:
      # Which SourceStorage adapter holds the bytes. The local profile selects azure-blob and supplies its
      # Azurite settings. Blob container names and credentials belong to the adapter's own settings, never here.
      # With this unset in another profile, the source service and its HTTP controller are not created.
  documents:
    history:
      # How old the newest restore point must be before an autosave takes another one. A manual save is always
      # a restore point; an autosave is one only when this much time has passed since the last. ISO-8601
      # duration. See dev.researchhub.document.application.CheckpointPolicy and V7__create_document_versions.sql.
      autosave-checkpoint-interval: PT10M

spring:
  application:
    name: backend

server:
  servlet:
    session:
      cookie:
        # The session id is the credential. JavaScript must never be able to read it: see
        # docs/adr/ADR-001-authentication.md.
        http-only: true
        # Limits cross-site submission of the cookie. Defence in depth behind CSRF tokens, not a
        # replacement for them.
        same-site: lax
        # `secure` is set per profile: false locally so http://localhost works, true wherever the app is
        # served over HTTPS.

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
