[project]
name = "researchhub-ai-worker"
version = "0.1.0"
description = "Internal ResearchHub processing worker"
requires-python = "==3.13.3"
dependencies = []

[project.optional-dependencies]
test = [
    "coverage==7.14.0",
    "pytest==8.4.2",
    "pytest-cov==6.0.0",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=researchhub_worker --cov-report=term-missing --cov-fail-under=80"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["researchhub_worker"]

[tool.coverage.report]
show_missing = true
skip_covered = true
