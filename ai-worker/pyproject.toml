[project]
name = "researchhub-ai-worker"
version = "0.1.0"
description = "Internal ResearchHub processing worker"
requires-python = "==3.13.3"
dependencies = [
    "prometheus-client==0.26.0",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "pypdf==6.19.0",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "defusedxml==0.7.1",
]

[project.scripts]
researchhub-worker = "researchhub_worker.__main__:main"

[dependency-groups]
dev = [
    "coverage==7.14.0",
    "httpx2==2.13.1",
    "pytest==8.4.2",
    "pytest-cov==6.0.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchhub_worker"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=researchhub_worker --cov-report=term-missing --cov-fail-under=80"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["researchhub_worker"]

[tool.coverage.report]
show_missing = true
skip_covered = true
