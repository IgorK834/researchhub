name: researchhub-scale
x-backend: &backend
  image: researchhub-backend:demo
  build: {context: ../../backend}
  mem_limit: 1g
  pids_limit: 256
  read_only: true
  tmpfs: ["/tmp:rw,nosuid,noexec,size=256m"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    postgres: {condition: service_healthy}
    azurite: {condition: service_healthy}
    ai-worker: {condition: service_healthy}
  environment: &backend-environment
    SPRING_PROFILES_ACTIVE: demo
    DB_HOST: postgres
    DB_NAME: researchhub
    DB_USER: researchhub
    DB_PASSWORD: ${DEMO_DB_PASSWORD:?Run scripts/demo/scale-up.sh first}
    AUTH_SESSION_STORE: jdbc
    COST_QUOTA_STORE: postgres
    AI_WORKER_BASE_URL: http://ai-worker:8090
    AI_WORKER_SERVICE_TOKEN: ${AI_WORKER_SERVICE_TOKEN:?Worker service token required}
    METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:?Metrics scrape token required}
    AZURITE_BLOB_ENDPOINT: http://azurite:10000/devstoreaccount1
    BLOB_CREATE_CONTAINER_ON_STARTUP: "true"
    ANALYSIS_SANDBOX_ENABLED: "false"
    COLLABORATION_ENABLED: "false"
    # RH-325 is an HTTP loopback benchmark with its original minute-based admission workload.
    RESEARCHHUB_ENVIRONMENT: local
    SERVER_SERVLET_SESSION_COOKIE_SECURE: "false"
    RESEARCHHUB_SECURITY_QUOTAS_WINDOW: PT1M
    RESEARCHHUB_SECURITY_QUOTAS_LLM_USER: "20"
    RESEARCHHUB_SECURITY_QUOTAS_LLM_WORKSPACE: "60"
    RESEARCHHUB_SECURITY_QUOTAS_ANALYSIS_USER: "10"
    RESEARCHHUB_SECURITY_QUOTAS_ANALYSIS_WORKSPACE: "30"
    SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "8"
    SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"
    SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "3000"
    SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: "240000"
    SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD: "0"
    CORS_ALLOWED_ORIGINS: http://localhost:18080
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    command: [postgres, -c, max_connections=50]
    environment:
      POSTGRES_DB: researchhub
      POSTGRES_USER: researchhub
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Database password required}
    ports: ["127.0.0.1:15532:5432"]
    volumes: [scale-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U researchhub -d researchhub"]
      interval: 3s
      timeout: 3s
      retries: 30
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --silent
    ports: ["127.0.0.1:11000:10000"]
    volumes: [scale-blob:/data]
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:10000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
  ai-worker:
    image: researchhub-ai-worker:demo
    build: {context: ../../ai-worker}
    mem_limit: 1g
    pids_limit: 64
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,noexec,size=128m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:18090:8090"]
    environment:
      AI_WORKER_SERVICE_TOKEN: ${AI_WORKER_SERVICE_TOKEN:?Worker service token required}
      AI_WORKER_MODEL_PROVIDER: deterministic
      AI_WORKER_EMBEDDING_PROVIDER: deterministic
      AI_WORKER_BLOB_URL_ORIGIN: http://127.0.0.1:11000
      AI_WORKER_BLOB_URL_TARGET_ORIGIN: http://azurite:10000
  backend-1:
    <<: *backend
    hostname: backend-1
    environment: {<<: *backend-environment, INSTANCE_ID: backend-1}
    ports: ["127.0.0.1:18081:8080"]
  backend-2:
    <<: *backend
    hostname: backend-2
    environment: {<<: *backend-environment, INSTANCE_ID: backend-2}
    ports: ["127.0.0.1:18082:8080"]
  caddy:
    image: researchhub-caddy:demo
    build: {context: ., dockerfile: Dockerfile.caddy}
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,noexec,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment: {XDG_CONFIG_HOME: /tmp/config, XDG_DATA_HOME: /tmp/data}
    ports: ["127.0.0.1:18080:8080"]
    volumes: ["./Caddyfile.scale:/etc/caddy/Caddyfile:ro"]
    depends_on:
      backend-1: {condition: service_healthy}
      backend-2: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  scale-postgres:
  scale-blob:
